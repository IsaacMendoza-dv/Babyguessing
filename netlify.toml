[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/guesses"
  to = "/.netlify/functions/guesses"
  status = 200

[[redirects]]
  from = "/api/announce"
  to = "/.netlify/functions/announce"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
