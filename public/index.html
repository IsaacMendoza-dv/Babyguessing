<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>When will baby boy arrive?</title>
  <meta name="description" content="A family guessing game: pick the date you think Alexa and Ryan's baby boy will arrive. Up to 3 guesses per date. Available in English, Filipino and Spanish.">
  <link rel="canonical" href="https://baby-alexa-ryan.vercel.app/">

  <!-- Link preview (WhatsApp, Facebook, iMessage, Telegram) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Baby Guessing Game">
  <meta property="og:url" content="https://baby-alexa-ryan.vercel.app/">
  <meta property="og:title" content="When will baby boy arrive? 🍼">
  <meta property="og:description" content="Family guessing game for Alexa &amp; Ryan: pick the date you think their baby boy will arrive. Up to 3 guesses per date. English, Filipino and Spanish.">
  <meta property="og:image" content="https://baby-alexa-ryan.vercel.app/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="When will baby boy arrive? Family guessing game for Alexa and Ryan">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="When will baby boy arrive? 🍼">
  <meta name="twitter:description" content="Family guessing game for Alexa &amp; Ryan: pick the date you think their baby boy will arrive.">
  <meta name="twitter:image" content="https://baby-alexa-ryan.vercel.app/og-image.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#4f7cff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <script>try{if(!localStorage.getItem("lang")||/[?&]welcome\b/.test(location.search))document.documentElement.classList.add("no-lang")}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div class="floaters" aria-hidden="true"><span>🎈</span><span>⭐</span><span>🧸</span><span>🎈</span><span>🧸</span><span>⭐</span></div>
    <div class="welcome-card">
      <div class="baby" aria-hidden="true">🍼</div>
      <h2 id="welcomeTitle">Welcome!</h2>
      <p class="welcome-sub">Maligayang pagdating • ¡Bienvenidos!</p>
      <p class="welcome-ask">Choose your language<br><span>Piliin ang iyong wika • Elige tu idioma</span></p>
      <div class="choices">
        <button type="button" class="choice" data-code="en" lang="en"><strong>English</strong><span>Let's play!</span></button>
        <button type="button" class="choice" data-code="fil" lang="fil"><strong>Filipino</strong><span>Maglaro tayo!</span></button>
        <button type="button" class="choice" data-code="es" lang="es"><strong>Español</strong><span>¡A jugar!</span></button>
      </div>
    </div>
  </div>
  <div class="floaters" aria-hidden="true"><span>🎈</span><span>⭐</span><span>🧸</span><span>🎈</span><span>🧸</span><span>⭐</span></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <header>
    <div id="lang"></div>
    <div class="baby" aria-hidden="true">🍼</div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <div class="countdown" id="countdown"></div>
  </header>
  <main>
    <section>
      <h2 id="step1"></h2>
      <p id="legend" class="muted"></p>
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" id="viewCal" aria-pressed="true"></button>
        <button type="button" id="viewList" aria-pressed="false"></button>
      </div>
      <div id="calendar">
        <div id="calGrid"></div>
        <div id="calDetail" class="cal-detail" aria-live="polite"></div>
      </div>
      <div class="table-wrap" id="listView" hidden>
        <table role="table">
          <thead role="rowgroup"><tr role="row">
            <th scope="col" role="columnheader" id="colDate"></th><th scope="col" role="columnheader" id="colDay"></th>
            <th scope="col" role="columnheader" id="colWho"></th><th scope="col" role="columnheader"></th>
          </tr></thead>
          <tbody id="rows" role="rowgroup"></tbody>
        </table>
      </div>
    </section>
    <section id="formSection">
      <h2 id="step2"></h2>
      <form id="form" novalidate>
        <p id="selected" class="selected"></p>
        <label for="name" id="nameLabel"></label>
        <input id="name" name="name" required maxlength="80" autocomplete="name" autocapitalize="words" enterkeyhint="next">
        <label for="email" id="emailLabel"></label>
        <input id="email" name="email" type="email" required maxlength="120" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" enterkeyhint="next">
        <button type="submit" id="submit"></button>
        <p id="msg" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer id="footer"></footer>
  <div class="bar" id="bar" hidden>
    <span id="barText"></span>
    <button type="button" id="barGo"></button>
  </div>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="langswitch.js"></script>
  <script src="app.js"></script>
</body>
</html>
