<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>When will baby boy arrive?</title>
  <meta name="description" content="A family guessing game: pick the date you think Alexa and Ryan's baby boy will arrive. Up to 3 guesses per date. Available in English, Filipino and Spanish.">
  <link rel="canonical" href="https://baby-alexa-ryan.vercel.app/">

  <!-- Link preview (WhatsApp, Facebook, iMessage, Telegram) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Baby Guessing Game">
  <meta property="og:url" content="https://baby-alexa-ryan.vercel.app/">
  <meta property="og:title" content="When will baby boy arrive? 🍼">
  <meta property="og:description" content="Family guessing game for Alexa &amp; Ryan: pick the date you think their baby boy will arrive. Up to 3 guesses per date. English, Filipino and Spanish.">
  <meta property="og:image" content="https://baby-alexa-ryan.vercel.app/og-banner.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Illustration of Alexa and Ryan expecting their baby in front of a balloon arch that reads We can Bearly wait">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="When will baby boy arrive? 🍼">
  <meta name="twitter:description" content="Family guessing game for Alexa &amp; Ryan: pick the date you think their baby boy will arrive.">
  <meta name="twitter:image" content="https://baby-alexa-ryan.vercel.app/og-banner.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#4f7cff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <script>
    // La pantalla de idioma sale SIEMPRE al entrar. Un enlace con ?lang=en|fil|es la salta (útil para compartir en un idioma).
    try {
      var m = location.search.match(/[?&]lang=(en|fil|es)\b/);
      if (m) localStorage.setItem("lang", m[1]); else document.documentElement.classList.add("no-lang");
    } catch (e) { document.documentElement.classList.add("no-lang"); }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div class="floaters" aria-hidden="true"><span>🎈</span><span>⭐</span><span>🧸</span><span>🎈</span><span>🧸</span><span>⭐</span></div>
    <div class="welcome-card">
      <img class="welcome-hero" src="banner.jpg" width="1200" height="800" alt="">
      <h2 id="welcomeTitle">Welcome!</h2>
      <p class="welcome-sub">Maligayang pagdating • ¡Bienvenidos!</p>
      <p class="welcome-ask">Choose your language<br><span>Piliin ang iyong wika • Elige tu idioma</span></p>
      <div class="choices">
        <button type="button" class="choice" data-code="en" lang="en"><strong><img class="flag" src="flags/us.svg" alt="" width="28" height="28">English</strong><span>Let's play!</span></button>
        <button type="button" class="choice" data-code="fil" lang="fil"><strong><img class="flag" src="flags/ph.svg" alt="" width="28" height="28">Filipino</strong><span>Maglaro tayo!</span></button>
        <button type="button" class="choice" data-code="es" lang="es"><strong><img class="flag" src="flags/mx.svg" alt="" width="28" height="28">Español</strong><span>¡A jugar!</span></button>
      </div>
    </div>
  </div>
  <div class="floaters" aria-hidden="true"><span>🎈</span><span>⭐</span><span>🧸</span><span>🎈</span><span>🧸</span><span>⭐</span></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="hero">
    <img id="banner" src="banner.jpg" width="1200" height="800" fetchpriority="high" alt="Illustration of Alexa and Ryan expecting their baby in front of a balloon arch that reads We can Bearly wait">
    <div id="lang"></div>
  </div>
  <header>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <div class="countdown" id="countdown"></div>
  </header>
  <main>
    <form id="form" novalidate>
      <section id="formSection">
        <h2 id="step2"></h2>
        <label for="name" id="nameLabel"></label>
        <input id="name" name="name" required maxlength="80" autocomplete="name" autocapitalize="words" enterkeyhint="next" aria-required="true" aria-describedby="nameError">
        <p class="field-error" id="nameError" role="alert" hidden></p>
        <label for="email" id="emailLabel"></label>
        <input id="email" name="email" type="email" required maxlength="120" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-required="true" aria-describedby="emailError">
        <p class="field-error" id="emailError" role="alert" hidden></p>
      </section>
      <section id="dateSection">
        <h2 id="step1"></h2>
        <p id="legend" class="muted"></p>
        <p id="dueLegend" class="due-legend"></p>
        <p class="field-error" id="pickError" role="alert" hidden></p>
        <div class="view-row">
          <div class="view-toggle" role="group" aria-label="View">
            <button type="button" id="viewCal" aria-pressed="true"></button>
            <button type="button" id="viewList" aria-pressed="false"></button>
          </div>
          <button type="button" class="btn-ghost" id="rulesBtn"></button>
        </div>
        <div id="calendar">
          <div id="calGrid"></div>
          <div id="calDetail" class="cal-detail" aria-live="polite"></div>
        </div>
        <div class="table-wrap" id="listView" hidden>
          <table role="table">
            <thead role="rowgroup"><tr role="row">
              <th scope="col" role="columnheader" id="colDate"></th><th scope="col" role="columnheader" id="colDay"></th>
              <th scope="col" role="columnheader" id="colWho"></th><th scope="col" role="columnheader"></th>
            </tr></thead>
            <tbody id="rows" role="rowgroup"></tbody>
          </table>
        </div>
        <div class="submit-area" id="submitArea">
          <p id="selected" class="selected"></p>
          <p class="field-error" id="dateError" role="alert" hidden></p>
          <button type="submit" id="submit"></button>
          <p id="msg" role="status" aria-live="polite"></p>
        </div>
      </section>
    </form>
    <section id="boardSection">
      <h2 id="boardTitle"></h2>
      <p id="boardIntro" class="muted"></p>
      <div class="board" id="board" aria-live="polite"></div>
      <p id="boardEmpty" class="board-empty" hidden></p>
      <button type="button" class="btn-ghost view-all" id="viewAllMsgs" hidden></button>
      <p id="boardNote" class="admin-msg ok" role="status" aria-live="polite"></p>
      <button type="button" class="btn-primary leave-btn" id="leaveMsg"></button>
    </section>
  </main>
  <footer>
    <img class="dev-pic" id="devPic" src="devs.jpg" width="720" height="480" loading="lazy" alt="Illustration of Feli and Chayi, who built this site">
    <p id="footer"></p>
  </footer>
  <dialog id="msgDialog" class="msg-dialog" aria-labelledby="msgDialogTitle">
    <form id="msgForm" novalidate>
      <h3 id="msgDialogTitle"></h3>
      <p id="msgDialogSub" class="muted"></p>
      <div class="postit-preview">
        <div class="postit yellow" id="msgPreview" style="--r:-2deg">
          <p class="postit-text" id="msgPreviewText"></p>
          <p class="postit-sign" id="msgPreviewSign"></p>
        </div>
      </div>
      <label for="msgText" id="msgTextLabel"></label>
      <textarea id="msgText" rows="4" maxlength="280" aria-describedby="msgTextError msgCount"></textarea>
      <p class="msg-count" id="msgCount"></p>
      <p class="field-error" id="msgTextError" role="alert" hidden></p>
      <label for="msgSign" id="msgSignLabel"></label>
      <input id="msgSign" maxlength="60" autocomplete="name" autocapitalize="words" aria-describedby="msgSignError">
      <p class="field-error" id="msgSignError" role="alert" hidden></p>
      <fieldset class="colors">
        <legend id="msgColorLabel"></legend>
        <label class="swatch yellow"><input type="radio" name="msgColor" value="yellow" checked><span></span></label>
        <label class="swatch pink"><input type="radio" name="msgColor" value="pink"><span></span></label>
        <label class="swatch blue"><input type="radio" name="msgColor" value="blue"><span></span></label>
        <label class="swatch green"><input type="radio" name="msgColor" value="green"><span></span></label>
        <label class="swatch orange"><input type="radio" name="msgColor" value="orange"><span></span></label>
      </fieldset>
      <p id="msgFormMsg" class="admin-msg" role="status" aria-live="polite"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost" id="msgLater"></button>
        <button type="submit" class="btn-primary" id="msgSend"></button>
      </div>
    </form>
  </dialog>
  <dialog id="allMsgs" class="all-msgs" aria-labelledby="allMsgsTitle">
    <div class="all-head">
      <h3 id="allMsgsTitle"></h3>
      <button type="button" class="btn-ghost" id="allMsgsClose"></button>
    </div>
    <div class="board settled" id="allBoard"></div>
  </dialog>
  <dialog id="rules" class="rules" aria-labelledby="rulesTitle">
    <h3 id="rulesTitle"></h3>
    <ul class="rules-list">
      <li id="rule1"></li><li id="rule2"></li><li id="rule3"></li><li id="rule4"></li><li id="rule5"></li><li id="rule7"></li><li id="rule6" class="prize"></li>
    </ul>
    <form method="dialog"><button class="btn-primary" id="rulesOk"></button></form>
  </dialog>
  <div class="bar" id="bar" hidden>
    <span id="barText"></span>
    <button type="button" id="barGo"></button>
  </div>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="langswitch.js"></script>
  <script src="app.js"></script>
</body>
</html>
