<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#4f7cff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Admin</h1></header>
  <main>
    <section>
      <form id="f">
        <label for="token">Admin token</label>
        <input id="token" type="password" required autocomplete="off">
        <label for="date">Fecha de nacimiento / Birth date</label>
        <input id="date" type="date" required>
        <button type="submit" id="preview">Ver ganadores / Preview</button>
        <button type="submit" id="send">Enviar correos / Send emails</button>
        <pre id="out" role="status"></pre>
      </form>
    </section>
  </main>
  <script>
    let preview = true;
    document.getElementById("preview").onclick = () => (preview = true);
    document.getElementById("send").onclick = () => (preview = false);
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const out = document.getElementById("out");
      if (!preview && !confirm("¿Enviar correos a los ganadores?")) return;
      const r = await fetch("/api/announce", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token.value, birthDate: date.value, preview })
      });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    };
  </script>
</body>
</html>
