<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#4f7cff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin">
  <div class="floaters" aria-hidden="true"><span>🎈</span><span>⭐</span><span>🧸</span><span>🎈</span><span>🧸</span><span>⭐</span></div>
  <header>
    <div id="lang"></div>
    <div class="baby" aria-hidden="true">🍼</div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </header>

  <main>
    <!-- Login -->
    <section id="loginCard">
      <form id="loginForm">
        <label for="token" id="tokenLabel"></label>
        <input id="token" type="password" required autocomplete="current-password">
        <button type="submit" id="enter"></button>
        <p id="loginMsg" class="admin-msg" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- Dashboard -->
    <div id="dash" hidden>
      <section>
        <div class="admin-top">
          <h2 id="summaryTitle"></h2>
          <button type="button" class="btn-ghost" id="logout"></button>
        </div>
        <div class="stats" id="stats"></div>
        <p id="emailStatus" class="chip"></p>
      </section>

      <section>
        <h2 id="winnersTitle"></h2>
        <form id="winnersForm" class="winners-form">
          <label for="date" id="dateLabel"></label>
          <input id="date" type="date" required>
          <button type="submit" id="search"></button>
        </form>
        <div id="winnersOut" aria-live="polite"></div>
      </section>

      <section>
        <div class="admin-top">
          <h2 id="allTitle"></h2>
          <button type="button" class="btn-ghost" id="csv"></button>
        </div>
        <div id="allList"></div>
      </section>

      <section>
        <div class="admin-top">
          <h2 id="msgsTitle"></h2>
          <button type="button" class="btn-ghost" id="msgsCsv"></button>
        </div>
        <div class="msg-tools" id="msgTools">
          <label class="visually-hidden" for="msgSearch" id="msgSearchLabel"></label>
          <input id="msgSearch" type="search" maxlength="60" autocomplete="off">
          <span class="chip" id="msgCount"></span>
        </div>
        <div class="board settled" id="adminBoard"></div>
        <p id="msgsEmpty" class="board-empty" hidden></p>
        <nav class="pager" id="pager" hidden>
          <button type="button" class="pager-btn" id="pagePrev">&#8249;</button>
          <span id="pageInfo" aria-live="polite"></span>
          <button type="button" class="pager-btn" id="pageNext">&#8250;</button>
        </nav>
      </section>
    </div>
  </main>

  <dialog id="confirm">
    <form method="dialog">
      <h3 id="confirmTitle"></h3>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn-ghost" id="cancel"></button>
        <button value="ok" class="btn-primary" id="ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="reader" class="reader" aria-label="Message">
    <div class="reader-stage">
      <article class="postit yellow" id="readerNote" style="--r:-1.5deg">
        <p class="postit-text" id="readerText"></p>
        <p class="postit-sign" id="readerSign"></p>
        <p class="postit-date" id="readerDate"></p>
      </article>
    </div>
    <div class="reader-nav">
      <button type="button" class="pager-btn" id="readerPrev">&#8249;</button>
      <span id="readerCount" aria-live="polite"></span>
      <button type="button" class="pager-btn" id="readerNext">&#8250;</button>
    </div>
    <button type="button" class="btn-ghost reader-close" id="readerClose"></button>
  </dialog>
  <script src="langswitch.js"></script>
  <script src="admin.js"></script>
</body>
</html>
